<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            animation: backgroundAnimation 5s infinite alternate;
            overflow: hidden;
            position: relative;
        }
        
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        
        .heart {
            position: absolute;
            bottom: -10px;
            width: 20px;
            height: 20px;
            background: red;
            clip-path: polygon(50% 0%, 100% 40%, 80% 100%, 50% 80%, 20% 100%, 0% 40%);
            opacity: 0.7;
            animation: floatUp 5s linear infinite;
        }
        
        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 0.7;
            }
            to {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
        
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        button {
            border: 2px solid black;
            background: red;
            color: white;
            padding: 15px;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s;
        }

        button:hover {
            transform: scale(1.2);
        }
        
        #yes {
            background: #ff4d6d;
        }

        #no {
            background: #ff4d6d;
        }
        
        .card {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="hearts"></div>
    <h1>¿Quieres ser mi San Valentín?</h1>
    <div class="buttons">
        <button id="yes" onclick="showLove()">❤️ Sí</button>
        <button id="no" onmouseover="moveButton()">💔 No</button>
    </div>
    <div id="card" class="card">
        <h2>Te Amo ❤️</h2>
    </div>
    
    <script>
        function moveButton() {
            let noButton = document.getElementById("no");
            let maxX = window.innerWidth - noButton.offsetWidth;
            let maxY = window.innerHeight - noButton.offsetHeight;
            
            // Generar nuevas coordenadas aleatorias dentro de los límites
            let x = Math.random() * maxX;
            let y = Math.random() * maxY;
            
            // Asegurarse de que el botón no salga de la pantalla
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            // Aplicar las nuevas coordenadas al botón
            noButton.style.position = 'fixed'; // Usamos 'fixed' para que no se desplace con el scroll
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }
        
        function showLove() {
            document.getElementById("card").style.display = "block";
        }
        
        function createHearts() {
            const heartsContainer = document.querySelector(".hearts");
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 2 + 3 + "s";
                heartsContainer.appendChild(heart);
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 500);
        }
        createHearts();
    </script>
</body>
</html>
